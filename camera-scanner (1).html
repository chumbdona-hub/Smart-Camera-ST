<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SENTRY-CAM // Camera quét & nhận diện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05080a;
    --panel:#0d1512;
    --panel-line:#1c2e26;
    --phosphor:#3be27a;
    --phosphor-dim:#1f7a48;
    --person:#4fd3ff;
    --vehicle:#ffb020;
    --object:#c9c9c9;
    --danger:#ff4d5e;
    --ink:#dff5e8;
    --ink-dim:#7fa694;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:'Inter',system-ui,sans-serif; color:var(--ink);
    overscroll-behavior:none;
  }
  #app{
    position:fixed; inset:0; display:flex; flex-direction:column;
    background:var(--bg);
  }

  /* ---------- Viewport (video + canvas) ---------- */
  #viewport{
    position:relative; flex:1; min-height:0; background:#000;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  video{ display:none; }
  canvas#stage{ width:100%; height:100%; object-fit:cover; display:block; }

  /* corner HUD brackets */
  .bracket{ position:absolute; width:22px; height:22px; border-color:var(--phosphor-dim); pointer-events:none; opacity:.9;}
  .bracket.tl{ top:10px; left:10px; border-top:2px solid; border-left:2px solid;}
  .bracket.tr{ top:10px; right:10px; border-top:2px solid; border-right:2px solid;}
  .bracket.bl{ bottom:10px; left:10px; border-bottom:2px solid; border-left:2px solid;}
  .bracket.br{ bottom:10px; right:10px; border-bottom:2px solid; border-right:2px solid;}

  /* top HUD strip */
  #hud-top{
    position:absolute; top:0; left:0; right:0; padding:10px 16px 0 16px;
    display:flex; justify-content:space-between; align-items:flex-start;
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--phosphor);
    pointer-events:none; letter-spacing:.02em; z-index:5;
  }
  #hud-top .lbl{ color:var(--ink-dim); }
  #hud-title{ font-weight:700; font-size:12px; }
  #hud-stats{ text-align:right; line-height:1.5; }

  /* status / loading / permission messages */
  #status-msg{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; z-index:6; padding:22px 26px; max-width:86%;
    background:rgba(6,12,10,.88); border:1px solid var(--panel-line); border-radius:4px;
    font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--phosphor); line-height:1.6;
  }
  #status-msg.hidden{ display:none; }
  #status-msg button{
    margin-top:14px; background:var(--phosphor); color:#03110a; border:none;
    font-family:'Inter'; font-weight:600; padding:9px 18px; border-radius:3px; font-size:13px;
  }

  /* QR result panel */
  #qr-panel{
    position:absolute; left:16px; right:16px; bottom:14px; z-index:6;
    background:rgba(6,14,11,.92); border:1px solid var(--phosphor-dim); border-radius:5px;
    padding:12px 14px; display:none; font-family:'JetBrains Mono',monospace; font-size:12.5px;
  }
  #qr-panel.show{ display:block; }
  #qr-panel .qr-label{ color:var(--phosphor); font-size:10px; letter-spacing:.08em; margin-bottom:4px;}
  #qr-panel .qr-text{ color:var(--ink); word-break:break-all; margin-bottom:8px;}
  #qr-panel a{
    display:inline-block; background:var(--phosphor); color:#03110a; text-decoration:none;
    font-family:'Inter'; font-weight:600; font-size:12px; padding:6px 12px; border-radius:3px;
  }

  /* 3D scan result panel */
  #scan-panel{
    position:absolute; left:16px; right:16px; bottom:14px; z-index:6;
    background:rgba(6,14,11,.94); border:1px solid var(--phosphor); border-radius:5px;
    padding:14px 16px; display:none;
  }
  #scan-panel.show{ display:block; }
  #scan-panel h3{ margin:0 0 6px 0; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--phosphor); letter-spacing:.03em;}
  #scan-panel .row{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-dim); padding:2px 0;}
  #scan-panel .row b{ color:var(--ink); font-weight:500;}
  #scan-panel .note{ font-size:11px; color:var(--ink-dim); margin-top:8px; line-height:1.5; font-family:'Inter';}
  #scan-panel button{
    margin-top:10px; width:100%; background:transparent; border:1px solid var(--phosphor-dim);
    color:var(--phosphor); font-family:'Inter'; font-weight:600; padding:9px; border-radius:3px; font-size:13px;
  }

  /* ---------- Control bar ---------- */
  #controls{
    flex-shrink:0; background:var(--panel); border-top:1px solid var(--panel-line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
    display:flex; flex-direction:column; gap:10px;
  }
  #modes{
    display:flex; gap:6px;
  }
  .mode-btn{
    flex:1; background:#101c17; border:1px solid var(--panel-line); color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; letter-spacing:.03em;
    padding:9px 4px; border-radius:4px; text-align:center;
  }
  .mode-btn.active{ background:rgba(59,226,122,.12); border-color:var(--phosphor); color:var(--phosphor); }

  #action-row{ display:flex; align-items:center; gap:14px; }
  #camswap{
    width:42px; height:42px; border-radius:50%; border:1px solid var(--panel-line);
    background:#101c17; color:var(--ink-dim); font-size:16px; flex-shrink:0;
  }
  #scan3d-btn{
    flex:1; height:52px; border-radius:26px; border:2px solid var(--phosphor);
    background:linear-gradient(180deg, rgba(59,226,122,.16), rgba(59,226,122,.05));
    color:var(--phosphor); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13.5px;
    letter-spacing:.06em; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  #scan3d-btn:active{ transform:scale(.97); }
  #scan3d-btn .dot{ width:8px; height:8px; border-radius:50%; background:var(--phosphor); }
  #scan3d-btn.recording{
    border-color:var(--danger);
    background:linear-gradient(180deg, rgba(255,77,94,.18), rgba(255,77,94,.06));
    color:var(--danger);
    animation:recPulseBtn 1.1s infinite;
  }
  #scan3d-btn.recording .dot{ background:var(--danger); animation:recPulseDot .9s infinite; }
  @keyframes recPulseBtn{ 0%,100%{border-color:var(--danger);} 50%{border-color:#ffb0b6;} }
  @keyframes recPulseDot{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.35; transform:scale(.8);} }
  #rec-indicator{
    display:none; align-items:center; gap:5px; color:var(--danger);
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.05em;
    margin-top:3px;
  }
  #rec-indicator.show{ display:flex; }
  #rec-indicator i{ width:8px; height:8px; border-radius:50%; background:var(--danger); animation:recPulseDot .9s infinite; }
  #scan-panel .video-link{
    display:inline-block; margin-top:8px; background:transparent; border:1px solid var(--danger);
    color:var(--danger); text-decoration:none; font-family:'Inter'; font-weight:600; font-size:12.5px;
    padding:7px 12px; border-radius:3px;
  }
  #legend{
    display:flex; gap:14px; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-dim);
  }
  #legend span{ display:flex; align-items:center; gap:5px;}
  #legend i{ width:9px; height:9px; border-radius:2px; display:inline-block;}
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="stage"></canvas>

    <div class="bracket tl"></div><div class="bracket tr"></div>
    <div class="bracket bl"></div><div class="bracket br"></div>

    <div id="hud-top">
      <div>
        <div id="hud-title">SENTRY-CAM</div>
        <div class="lbl" id="hud-mode">CHẾ ĐỘ: BÌNH THƯỜNG</div>
        <div id="rec-indicator"><i></i>REC · ĐANG QUAY QUÉT 3D</div>
      </div>
      <div id="hud-stats">
        <div><span class="lbl">FPS</span> <span id="fps">--</span></div>
        <div><span class="lbl">VẬT THỂ</span> <span id="objcount">0</span></div>
        <div><span class="lbl">SÁNG</span> <span id="glare">BÌNH THƯỜNG</span></div>
      </div>
    </div>

    <div id="status-msg">Đang khởi động camera...</div>
    <div id="qr-panel">
      <div class="qr-label">MÃ QR ĐÃ QUÉT</div>
      <div class="qr-text" id="qr-text"></div>
      <a id="qr-link" href="#" target="_blank" rel="noopener" style="display:none">Mở liên kết</a>
    </div>
    <div id="scan-panel">
      <h3 id="scan-title">ĐANG QUÉT VẬT THỂ 3D...</h3>
      <div id="scan-body"></div>
      <button id="scan-close">QUÉT LẠI</button>
    </div>
  </div>

  <div id="controls">
    <div id="legend">
      <span><i style="background:var(--person)"></i>Người</span>
      <span><i style="background:var(--vehicle)"></i>Phương tiện</span>
      <span><i style="background:var(--object)"></i>Vật thể khác</span>
    </div>
    <div id="modes">
      <button class="mode-btn active" data-mode="normal">BÌNH THƯỜNG</button>
      <button class="mode-btn" data-mode="night">ĐÊM</button>
      <button class="mode-btn" data-mode="thermal">NHIỆT</button>
      <button class="mode-btn" data-mode="qr">QUÉT QR</button>
    </div>
    <div id="action-row">
      <button id="camswap">⟲</button>
      <button id="scan3d-btn"><span class="dot"></span> <span id="scan3d-label">QUÉT VẬT THỂ 3D</span></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
  "use strict";

  // ---------- Elements ----------
  const video = document.getElementById('video');
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  const statusMsg = document.getElementById('status-msg');
  const fpsEl = document.getElementById('fps');
  const objCountEl = document.getElementById('objcount');
  const glareEl = document.getElementById('glare');
  const hudMode = document.getElementById('hud-mode');
  const qrPanel = document.getElementById('qr-panel');
  const qrText = document.getElementById('qr-text');
  const qrLink = document.getElementById('qr-link');
  const scanPanel = document.getElementById('scan-panel');
  const scanTitle = document.getElementById('scan-title');
  const scanBody = document.getElementById('scan-body');
  const scanCloseBtn = document.getElementById('scan-close');
  const scan3dBtn = document.getElementById('scan3d-btn');
  const scan3dLabel = document.getElementById('scan3d-label');
  const recIndicator = document.getElementById('rec-indicator');
  const camSwapBtn = document.getElementById('camswap');
  const modeBtns = [...document.querySelectorAll('.mode-btn')];

  // ---------- State ----------
  let mode = 'normal';               // normal | night | thermal | qr
  let facingMode = 'environment';
  let model = null;
  let tracks = [];                   // smoothed persistent tracks
  let trackIdSeq = 1;
  let lastDetectTime = 0;
  let DETECT_INTERVAL = 180;         // ms between neural-net detection passes -- adapts automatically based on device speed (see adaptInterval)
  const DETECT_INTERVAL_MIN = 100;
  const DETECT_INTERVAL_MAX = 700;
  const CONFIDENCE_MIN = 0.5;        // fallback ignore low-confidence noise
  // per-class minimum confidence -- person/motorcycle/bicycle are smaller & more varied
  // in real footage (especially Vietnamese traffic) so coco-ssd scores them lower than "car";
  // without this override the global 0.55 cutoff was silently dropping almost all of them.
  const CONF_MIN_BY_CLASS = {
    person: 0.4, motorcycle: 0.32, bicycle: 0.32,
    car: 0.5, truck: 0.5, bus: 0.5, train: 0.5, boat: 0.5
  };
  const MAX_DETECTIONS = 20;         // was 12 -- allow more simultaneous objects (people + xe máy in traffic)
  const IOU_MATCH_MIN = 0.28;        // matching threshold between frames
  const SMOOTH_FACTOR = 0.35;        // box position lerp factor per render frame
  const CONFIRM_HITS = 2;            // must be seen this many times before drawing (kills one-frame ghosts)
  const MAX_MISSED = 7;              // keep drawing a track this many missed cycles before removing (kills flicker)
  let scanning = false;
  let scanLockedTrack = null;
  let scanAnimStart = 0;
  const SCAN_ANIM_MS = 1300;

  // ---- 3D scan video recording + grid overlay ----
  let recording = false;
  let mediaRecorder = null;
  let recordedChunks = [];
  let lastVideoUrl = null;
  const GRID_COLS = 7, GRID_ROWS = 5;

  let frameCount = 0, lastFpsTime = performance.now(), fps = 0;

  // low-res offscreen canvases (reused, avoids per-frame allocation)
  const thermalW = 160, thermalH = 90;
  const thermalCanvas = document.createElement('canvas');
  thermalCanvas.width = thermalW; thermalCanvas.height = thermalH;
  const thermalCtx = thermalCanvas.getContext('2d', {willReadFrequently:true});

  // ---- Auto anti-glare (chống chói) ----
  const glareW = 48, glareH = 27;               // tiny sample canvas -- cheap to read every cycle
  const glareCanvas = document.createElement('canvas');
  glareCanvas.width = glareW; glareCanvas.height = glareH;
  const glareCtx = glareCanvas.getContext('2d', {willReadFrequently:true});
  let glareActive = false;
  let lastGlareCheck = 0;
  const GLARE_CHECK_INTERVAL = 350;   // ms between brightness samples
  const GLARE_LUM_ON = 190;           // average luminance (0-255) that triggers the filter
  const GLARE_LUM_OFF = 165;          // hysteresis so it doesn't flicker on/off at the edge

  function sampleGlare(ts, w, h){
    if(ts - lastGlareCheck < GLARE_CHECK_INTERVAL || w===0 || h===0) return;
    lastGlareCheck = ts;
    glareCtx.drawImage(video, 0, 0, glareW, glareH);
    const d = glareCtx.getImageData(0, 0, glareW, glareH).data;
    let sum = 0, over = 0, n = glareW*glareH;
    for(let i=0;i<d.length;i+=4){
      const l = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      sum += l;
      if(l>235) over++;             // near-blown-out pixels (direct glare/hotspot)
    }
    const avg = sum/n;
    const overRatio = over/n;
    // trip on either a high average exposure or a large blown-out hotspot area
    if(!glareActive && (avg>GLARE_LUM_ON || overRatio>0.18)) glareActive = true;
    else if(glareActive && avg<GLARE_LUM_OFF && overRatio<0.08) glareActive = false;
  }

  const qrScaleW = 320, qrScaleH = 180;
  const qrCanvas = document.createElement('canvas');
  qrCanvas.width = qrScaleW; qrCanvas.height = qrScaleH;
  const qrCtx = qrCanvas.getContext('2d', {willReadFrequently:true});
  let lastQrTime = 0;
  let lastQrValue = '';

  const CLASS_MAP = {
    person:      {label:'NGƯỜI', type:'person'},
    car:         {label:'Ô TÔ', type:'vehicle'},
    truck:       {label:'XE TẢI', type:'vehicle'},
    bus:         {label:'XE BUÝT', type:'vehicle'},
    motorcycle:  {label:'XE MÁY', type:'vehicle'},
    bicycle:     {label:'XE ĐẠP', type:'vehicle'},
    train:       {label:'TÀU HỎA', type:'vehicle'},
    boat:        {label:'THUYỀN', type:'vehicle'},
  };
  const COLORS = { person:'#4fd3ff', vehicle:'#ffb020', object:'#c9c9c9' };

  function classify(cocoClassName){
    const m = CLASS_MAP[cocoClassName];
    if(m) return m;
    return {label: cocoClassName.toUpperCase(), type:'object'};
  }

  // ---------- Camera setup ----------
  async function startCamera(){
    setStatus('Đang khởi động camera...');
    if(video.srcObject){
      video.srcObject.getTracks().forEach(t=>t.stop());
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ideal:facingMode}, width:{ideal:1280}, height:{ideal:720} },
        audio:false
      });
      video.srcObject = stream;
      await video.play();
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      clearStatus();
      loadModel();
    }catch(err){
      setStatus('KHÔNG THỂ MỞ CAMERA\n\n'+ (err.message || err.name) +
        '\n\nHãy chắc chắn bạn cho phép quyền camera, và mở trang này qua HTTPS hoặc mở trực tiếp file trên điện thoại.',
        true);
    }
  }

  function setStatus(text, showRetry){
    statusMsg.textContent = text;
    statusMsg.classList.remove('hidden');
    statusMsg.style.whiteSpace = 'pre-line';
    if(showRetry){
      const btn = document.createElement('button');
      btn.textContent = 'THỬ LẠI';
      btn.onclick = startCamera;
      statusMsg.appendChild(document.createElement('br'));
      statusMsg.appendChild(btn);
    }
  }
  function clearStatus(){ statusMsg.classList.add('hidden'); statusMsg.textContent=''; }

  async function loadModel(){
    setStatus('Đang tải mô hình nhận diện vật thể...\n(chỉ tải một lần)');
    try{
      // Force WebGL (GPU) backend explicitly -- without this tf.js can silently
      // fall back to the CPU backend on some mobile browsers, which is the main
      // cause of ~10fps lag since every detect() call then blocks the main thread.
      try{
        await tf.setBackend('webgl');
        tf.env().set('WEBGL_FORCE_F16_TEXTURES', true); // faster on mobile GPUs, small accuracy trade-off
      }catch(e){ /* if webgl truly unavailable, tf falls back on its own */ }
      await tf.ready();
      model = await cocoSsd.load({base:'lite_mobilenet_v2'});
      clearStatus();
      requestAnimationFrame(renderLoop);
      detectLoop();
    }catch(err){
      setStatus('Không tải được mô hình AI. Kiểm tra kết nối mạng rồi bấm thử lại.', true);
    }
  }

  // ---------- IOU helper ----------
  function iou(a,b){
    const ax2=a[0]+a[2], ay2=a[1]+a[3], bx2=b[0]+b[2], by2=b[1]+b[3];
    const ix1=Math.max(a[0],b[0]), iy1=Math.max(a[1],b[1]);
    const ix2=Math.min(ax2,bx2), iy2=Math.min(ay2,by2);
    const iw=Math.max(0, ix2-ix1), ih=Math.max(0, iy2-iy1);
    const inter = iw*ih;
    const union = a[2]*a[3] + b[2]*b[3] - inter;
    return union<=0 ? 0 : inter/union;
  }

  // ---------- Detection loop (throttled, async, decoupled from render) ----------
  async function detectLoop(){
    if(model && mode!=='qr' && video.readyState>=2){
      const t0 = performance.now();
      try{
        const preds = await model.detect(video, MAX_DETECTIONS);
        const filtered = preds.filter(p => p.score >= (CONF_MIN_BY_CLASS[p.class] ?? CONFIDENCE_MIN));
        applyDetections(filtered);
      }catch(e){ /* ignore transient detect errors, keep looping */ }
      adaptInterval(performance.now() - t0);
    }
    setTimeout(detectLoop, DETECT_INTERVAL);
  }

  // Auto-tune the gap between detection passes based on how long detect() actually took
  // on this device. Slow phones get a longer gap (frees the main thread -> smoother render
  // fps); fast phones/desktops get a shorter gap (faster, more responsive tracking).
  function adaptInterval(detectMs){
    const target = detectMs * 1.6; // leave headroom so render loop isn't starved
    DETECT_INTERVAL = Math.round(DETECT_INTERVAL*0.7 + Math.max(DETECT_INTERVAL_MIN, Math.min(DETECT_INTERVAL_MAX, target))*0.3);
  }

  function applyDetections(preds){
    const detections = preds.map(p=>{
      const info = classify(p.class);
      return { bbox:p.bbox, score:p.score, label:info.label, type:info.type };
    });

    const usedTrack = new Set();
    const usedDet = new Set();

    // match existing tracks to new detections by best IOU (same type preferred)
    for(let ti=0; ti<tracks.length; ti++){
      const tr = tracks[ti];
      let bestJ=-1, bestScore=0;
      for(let j=0;j<detections.length;j++){
        if(usedDet.has(j)) continue;
        const d = detections[j];
        const score = iou(tr.targetBbox, d.bbox) + (d.type===tr.type?0.05:0);
        if(score>bestScore){ bestScore=score; bestJ=j; }
      }
      if(bestJ>=0 && bestScore>=IOU_MATCH_MIN){
        const d = detections[bestJ];
        tr.targetBbox = d.bbox;
        tr.label = d.label;
        tr.type = d.type;
        tr.score = d.score;
        tr.missed = 0;
        tr.hits = Math.min(tr.hits+1, 999);
        usedDet.add(bestJ);
        usedTrack.add(ti);
      }
    }
    // age out unmatched tracks
    for(let ti=0; ti<tracks.length; ti++){
      if(!usedTrack.has(ti)){
        tracks[ti].missed++;
      }
    }
    tracks = tracks.filter(t=>t.missed<=MAX_MISSED);

    // create new tracks for unmatched detections
    for(let j=0;j<detections.length;j++){
      if(usedDet.has(j)) continue;
      const d = detections[j];
      tracks.push({
        id: trackIdSeq++,
        bbox: d.bbox.slice(),
        targetBbox: d.bbox.slice(),
        label: d.label, type: d.type, score: d.score,
        hits:1, missed:0
      });
    }
  }

  // ---------- Render loop ----------
  function renderLoop(ts){
    requestAnimationFrame(renderLoop);
    if(video.readyState<2){ return; }

    // FPS calc
    frameCount++;
    if(ts - lastFpsTime > 500){
      fps = Math.round(frameCount*1000/(ts-lastFpsTime));
      frameCount=0; lastFpsTime=ts;
      fpsEl.textContent = fps;
    }

    const w = canvas.width, h = canvas.height;
    sampleGlare(ts, w, h);

    // --- draw base frame per visual mode ---
    if(mode==='thermal'){
      thermalCtx.drawImage(video,0,0,thermalW,thermalH);
      const img = thermalCtx.getImageData(0,0,thermalW,thermalH);
      const d = img.data;
      for(let i=0;i<d.length;i+=4){
        const lum = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        const c = thermalPalette(lum);
        d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2];
      }
      thermalCtx.putImageData(img,0,0);
      ctx.imageSmoothingEnabled = false;
      ctx.filter='none';
      ctx.drawImage(thermalCanvas,0,0,w,h);
    } else if(mode==='night'){
      ctx.filter='brightness(1.9) contrast(1.25) grayscale(0.4) saturate(0.6)';
      ctx.drawImage(video,0,0,w,h);
      ctx.filter='none';
      ctx.fillStyle='rgba(30,255,120,0.16)';
      ctx.globalCompositeOperation='overlay';
      ctx.fillRect(0,0,w,h);
      ctx.globalCompositeOperation='source-over';
      // subtle grain for night-vision feel
      for(let i=0;i<40;i++){
        ctx.fillStyle='rgba(255,255,255,'+(Math.random()*0.04)+')';
        ctx.fillRect(Math.random()*w, Math.random()*h, 2, 2);
      }
    } else {
      ctx.filter = glareActive ? 'brightness(0.68) contrast(1.22) saturate(0.85)' : 'none';
      ctx.drawImage(video,0,0,w,h);
    }
    glareEl.textContent = glareActive ? 'CHÓI - ĐANG BÙ SÁNG' : 'BÌNH THƯỜNG';
    glareEl.style.color = glareActive ? 'var(--danger)' : 'var(--phosphor)';

    if(mode==='qr'){
      handleQr(ts, w, h);
    } else {
      if(qrPanel.classList.contains('show')) qrPanel.classList.remove('show');
    }

    // --- draw tracking boxes (smoothed) unless in qr mode or scanning overlay dominates ---
    if(mode!=='qr'){
      let visibleCount=0;
      for(const tr of tracks){
        if(tr.hits < CONFIRM_HITS) continue; // debounce: ignore one-off ghost detections
        // smooth toward target
        for(let k=0;k<4;k++){
          tr.bbox[k] += (tr.targetBbox[k]-tr.bbox[k]) * SMOOTH_FACTOR;
        }
        drawTrackBox(tr);
        visibleCount++;
      }
      objCountEl.textContent = visibleCount;
    }

    // --- 3D scan overlay: grid stays on for the whole recording, lock-on animation plays once ---
    if(recording){
      drawGridOverlay(ts, w, h);
    }
    if(scanning){
      drawScanAnimation(ts, w, h);
    }
  }

  function drawGridOverlay(ts, w, h){
    const pulse = 0.5 + 0.5*Math.sin(ts/450);
    ctx.save();
    ctx.strokeStyle = 'rgba(59,226,122,' + (0.22 + 0.10*pulse) + ')';
    ctx.lineWidth = 1;
    for(let c=1; c<GRID_COLS; c++){
      const x = (w/GRID_COLS)*c;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
    }
    for(let r=1; r<GRID_ROWS; r++){
      const y = (h/GRID_ROWS)*r;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    }
    // brighter pulsing nodes at intersections -- gives a "structured-light" scan feel
    ctx.fillStyle = 'rgba(59,226,122,' + (0.55 + 0.35*pulse) + ')';
    for(let c=1; c<GRID_COLS; c++){
      for(let r=1; r<GRID_ROWS; r++){
        const x=(w/GRID_COLS)*c, y=(h/GRID_ROWS)*r;
        ctx.beginPath(); ctx.arc(x,y,1.6,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }

  function thermalPalette(l){
    // 0..255 luminance -> blue -> teal -> green -> yellow -> red (fake thermal LUT)
    const stops = [
      [0,   [10,10,60]],
      [70,  [20,90,160]],
      [130, [30,180,120]],
      [180, [230,210,40]],
      [255, [230,40,30]]
    ];
    for(let i=0;i<stops.length-1;i++){
      const [l0,c0]=stops[i], [l1,c1]=stops[i+1];
      if(l>=l0 && l<=l1){
        const t=(l-l0)/(l1-l0);
        return [ c0[0]+(c1[0]-c0[0])*t, c0[1]+(c1[1]-c0[1])*t, c0[2]+(c1[2]-c0[2])*t ];
      }
    }
    return [230,40,30];
  }

  function drawTrackBox(tr){
    const [x,y,bw,bh] = tr.bbox;
    const color = COLORS[tr.type] || COLORS.object;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    // corner-bracket style box (HUD look) instead of plain rectangle
    const cl = Math.min(18, bw*0.25, bh*0.25);
    ctx.beginPath();
    ctx.moveTo(x, y+cl); ctx.lineTo(x,y); ctx.lineTo(x+cl,y);
    ctx.moveTo(x+bw-cl,y); ctx.lineTo(x+bw,y); ctx.lineTo(x+bw,y+cl);
    ctx.moveTo(x+bw,y+bh-cl); ctx.lineTo(x+bw,y+bh); ctx.lineTo(x+bw-cl,y+bh);
    ctx.moveTo(x+cl,y+bh); ctx.lineTo(x,y+bh); ctx.lineTo(x,y+bh-cl);
    ctx.stroke();
    ctx.shadowBlur = 0;

    const text = tr.label + '  ' + Math.round(tr.score*100) + '%';
    ctx.font = '600 12px JetBrains Mono, monospace';
    const tw = ctx.measureText(text).width;
    ctx.fillStyle = color;
    ctx.fillRect(x, Math.max(0,y-18), tw+10, 18);
    ctx.fillStyle = '#04140b';
    ctx.fillText(text, x+5, Math.max(12,y-5));
  }

  // ---------- QR handling ----------
  function handleQr(ts, w, h){
    if(ts - lastQrTime < 260) return;
    lastQrTime = ts;
    qrCtx.drawImage(video, 0,0, qrScaleW, qrScaleH);
    const img = qrCtx.getImageData(0,0,qrScaleW,qrScaleH);
    const code = jsQR(img.data, qrScaleW, qrScaleH, {inversionAttempts:'dontInvert'});
    if(code){
      const scaleX = w/qrScaleW, scaleY = h/qrScaleH;
      const pts = [code.location.topLeftCorner, code.location.topRightCorner,
                   code.location.bottomRightCorner, code.location.bottomLeftCorner];
      ctx.strokeStyle = '#3be27a'; ctx.lineWidth=3; ctx.shadowColor='#3be27a'; ctx.shadowBlur=8;
      ctx.beginPath();
      pts.forEach((p,i)=>{
        const px=p.x*scaleX, py=p.y*scaleY;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      });
      ctx.closePath(); ctx.stroke(); ctx.shadowBlur=0;

      if(code.data !== lastQrValue){
        lastQrValue = code.data;
        qrText.textContent = code.data;
        try{
          const u = new URL(code.data);
          qrLink.href = u.href; qrLink.style.display='inline-block';
        }catch(e){ qrLink.style.display='none'; }
        qrPanel.classList.add('show');
        if(navigator.vibrate) navigator.vibrate(60);
      }
    }
  }

  // ---------- 3D scan feature (grid overlay + video recording) ----------
  scan3dBtn.addEventListener('click', ()=>{
    if(recording){ stopScanSession(); }
    else{ startScanSession(); }
  });

  function startScanSession(){
    if(scanning) return;
    // pick highest-confidence confirmed track
    const candidates = tracks.filter(t=>t.hits>=CONFIRM_HITS);
    if(candidates.length===0){
      flashScanMessage('KHÔNG PHÁT HIỆN VẬT THỂ', 'Hướng camera vào một vật thể, người, hoặc phương tiện rồi thử lại.');
      return;
    }
    candidates.sort((a,b)=>b.score-a.score);
    scanLockedTrack = candidates[0];
    scanning = true;
    scanAnimStart = performance.now();
    scanTitle.textContent = 'ĐANG QUÉT VẬT THỂ 3D...';
    scanBody.innerHTML = '';
    scanPanel.classList.remove('show');

    startRecording();

    setTimeout(finishScan, SCAN_ANIM_MS);
  }

  function stopScanSession(){
    stopRecording();
    scanning = false;
  }

  function startRecording(){
    if(recording) return;
    if(typeof canvas.captureStream !== 'function' || typeof MediaRecorder === 'undefined'){
      flashScanMessage('KHÔNG HỖ TRỢ QUAY VIDEO', 'Trình duyệt này không hỗ trợ ghi video từ canvas. Vẫn có thể dùng đo đạc 3D bên dưới.');
      return;
    }
    try{
      const recFps = Math.min(30, Math.max(15, fps || 24));
      const stream = canvas.captureStream(recFps);
      const mimeCandidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
      const mimeType = mimeCandidates.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
      mediaRecorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
      recordedChunks = [];
      mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = onRecordingStopped;
      mediaRecorder.start(250);
      recording = true;
      scan3dBtn.classList.add('recording');
      scan3dLabel.textContent = 'ĐANG QUÉT & QUAY... (chạm để dừng)';
      recIndicator.classList.add('show');
    }catch(e){
      flashScanMessage('LỖI GHI VIDEO', 'Không thể bắt đầu quay video: ' + (e.message||e));
    }
  }

  function stopRecording(){
    if(!recording) return;
    recording = false;
    scan3dBtn.classList.remove('recording');
    scan3dLabel.textContent = 'QUÉT VẬT THỂ 3D';
    recIndicator.classList.remove('show');
    if(mediaRecorder && mediaRecorder.state !== 'inactive'){
      mediaRecorder.stop();
    }
  }

  function onRecordingStopped(){
    if(recordedChunks.length===0) return;
    const blob = new Blob(recordedChunks, {type: recordedChunks[0].type || 'video/webm'});
    if(lastVideoUrl) URL.revokeObjectURL(lastVideoUrl);
    lastVideoUrl = URL.createObjectURL(blob);
    recordedChunks = [];

    const stamp = new Date().toISOString().replace(/[:.]/g,'-');
    const filename = 'scan3d_' + stamp + '.webm';

    // append (or create) a download link inside the result panel
    let linkEl = document.getElementById('scan-video-link');
    if(!linkEl){
      linkEl = document.createElement('a');
      linkEl.id = 'scan-video-link';
      linkEl.className = 'video-link';
      scanBody.appendChild(linkEl);
    }
    linkEl.href = lastVideoUrl;
    linkEl.download = filename;
    linkEl.textContent = '⬇ TẢI VIDEO QUÉT 3D (.webm)';
    scanPanel.classList.add('show');
    if(navigator.vibrate) navigator.vibrate(30);
  }

  function drawScanAnimation(ts, w, h){
    const t = (ts-scanAnimStart)/SCAN_ANIM_MS;
    if(!scanLockedTrack) return;
    const [x,y,bw,bh] = scanLockedTrack.bbox;
    // dim everything outside box slightly
    ctx.fillStyle='rgba(0,10,6,0.35)';
    ctx.fillRect(0,0,w,h);
    ctx.clearRect(x,y,bw,bh);
    ctx.fillStyle='rgba(0,10,6,0.0)';

    // pseudo-3D wireframe cuboid from the 2D box
    const depth = Math.min(bw,bh)*0.35;
    ctx.strokeStyle = '#3be27a'; ctx.lineWidth=2; ctx.shadowColor='#3be27a'; ctx.shadowBlur=10;
    ctx.strokeRect(x,y,bw,bh);
    ctx.strokeRect(x+depth*0.5, y-depth*0.5, bw, bh);
    [[x,y],[x+bw,y],[x,y+bh],[x+bw,y+bh]].forEach(([px,py])=>{
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+depth*0.5, py-depth*0.5); ctx.stroke();
    });
    ctx.shadowBlur=0;

    // moving scan line, clamped within [0,1]
    const p = Math.min(1, Math.max(0, t));
    const scanY = y + bh*p;
    ctx.strokeStyle='rgba(59,226,122,0.9)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x-6, scanY); ctx.lineTo(x+bw+6, scanY); ctx.stroke();
  }

  function finishScan(){
    scanning = false;
    const tr = scanLockedTrack;
    if(!tr){ return; }
    const [,, bw, bh] = tr.bbox;
    const areaRatio = (bw*bh) / (canvas.width*canvas.height);
    let sizeCat = 'NHỎ';
    if(areaRatio>0.5) sizeCat='RẤT LỚN';
    else if(areaRatio>0.25) sizeCat='LỚN';
    else if(areaRatio>0.08) sizeCat='TRUNG BÌNH';

    scanTitle.textContent = 'KẾT QUẢ QUÉT';
    const recordNote = recording
      ? 'Video vẫn đang quay (xem lưới kẻ ô trên khung hình) — nhấn nút QUÉT VẬT THỂ 3D lần nữa để dừng và tải video.'
      : 'Ước tính hình khối dựa trên khung 2D từ camera thường — đây là ước lượng thị giác, không phải quét độ sâu 3D thực (cần cảm biến LiDAR/ToF chuyên dụng).';
    scanBody.innerHTML = `
      <div class="row"><span>Phân loại</span><b>${tr.label}</b></div>
      <div class="row"><span>Độ tin cậy AI</span><b>${Math.round(tr.score*100)}%</b></div>
      <div class="row"><span>Kích thước tương đối</span><b>${sizeCat}</b></div>
      <div class="row"><span>Tỉ lệ khung hình</span><b>${(bw/bh).toFixed(2)}:1</b></div>
      <div class="note">${recordNote}</div>
    `;
    scanPanel.classList.add('show');
    if(navigator.vibrate) navigator.vibrate([40,40,40]);
  }

  function flashScanMessage(title, body){
    scanTitle.textContent = title;
    scanBody.innerHTML = `<div class="note">${body}</div>`;
    scanPanel.classList.add('show');
    setTimeout(()=>scanPanel.classList.remove('show'), 2200);
  }

  scanCloseBtn.addEventListener('click', ()=>{
    scanPanel.classList.remove('show');
    scanLockedTrack = null;
  });

  // ---------- Mode switching ----------
  const modeLabels = {normal:'BÌNH THƯỜNG', night:'ĐÊM (TĂNG SÁNG)', thermal:'NHIỆT (MÔ PHỎNG)', qr:'QUÉT MÃ QR'};
  modeBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(recording) stopScanSession();
      mode = btn.dataset.mode;
      modeBtns.forEach(b=>b.classList.toggle('active', b===btn));
      hudMode.textContent = 'CHẾ ĐỘ: ' + modeLabels[mode];
      if(mode!=='qr'){ qrPanel.classList.remove('show'); lastQrValue=''; }
    });
  });

  camSwapBtn.addEventListener('click', ()=>{
    if(recording) stopScanSession();
    facingMode = facingMode==='environment' ? 'user' : 'environment';
    tracks = [];
    startCamera();
  });

  // ---------- Boot ----------
  startCamera();

})();
</script>
</body>
</html>
